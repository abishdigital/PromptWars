version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: recovery_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: recovery_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/recovery_platform
      - JWT_SECRET=super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: recovery_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
